name: CI
on:
  push:
    branches-ignore: []
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    name: Linux (GCC, Qt 6)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build g++ cmake \
            qt6-base-dev libqt6opengl6-dev libqt6svg6-dev qt6-tools-dev qt6-l10n-tools \
            libgl1-mesa-dev nlohmann-json3-dev libgtest-dev libgmock-dev xvfb
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DFOS_WERROR=ON
      - name: Build
        run: cmake --build build
      - name: Test
        run: xvfb-run -a ctest --test-dir build --output-on-failure
      - name: CLI smoke test
        run: |
          ./build/src/cli/fos --version
          ./build/src/cli/fos new "$RUNNER_TEMP/ci.fosp" --template base --id 00000000-0000-4000-8000-000000000000 --date 2026-01-01T00:00:00Z
          ./build/src/cli/fos set "$RUNNER_TEMP/ci.fosp" cab1 width 900
          ./build/src/cli/fos validate "$RUNNER_TEMP/ci.fosp"
          ./build/src/cli/fos cut "$RUNNER_TEMP/ci.fosp" --out-dir "$RUNNER_TEMP/cut"

  linux-headless-clang:
    name: Linux headless core (Clang)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build clang cmake \
            nlohmann-json3-dev libgtest-dev libgmock-dev
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=clang++ -DFOS_BUILD_GUI=OFF -DFOS_WERROR=ON
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  windows:
    name: Windows (MSVC, Qt 6) + portable ZIP
    runs-on: windows-2022
    env:
      QT_OPENGL: software
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.5.3'
          arch: win64_msvc2019_64
          cache: true
      - name: MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Install portable folder (runs windeployqt)
        run: cmake --install build --prefix dist/FurnitureOS
      - name: Check the folder is self-contained
        shell: pwsh
        run: ./packaging/windows/check-deployment.ps1 -Folder dist/FurnitureOS
      - name: Smoke test the packaged command-line tool
        shell: pwsh
        run: |
          $fos = "dist/FurnitureOS/fos.exe"
          & $fos --version; if ($LASTEXITCODE -ne 0) { exit 1 }
          & $fos new "$env:RUNNER_TEMP/ci.fosp" --template base --id 00000000-0000-4000-8000-000000000000 --date 2026-01-01T00:00:00Z; if ($LASTEXITCODE -ne 0) { exit 1 }
          & $fos set "$env:RUNNER_TEMP/ci.fosp" cab1 width 900; if ($LASTEXITCODE -ne 0) { exit 1 }
          & $fos validate "$env:RUNNER_TEMP/ci.fosp"; if ($LASTEXITCODE -ne 0) { exit 1 }
          & $fos cut "$env:RUNNER_TEMP/ci.fosp" --out-dir "$env:RUNNER_TEMP/cut"; if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Package ZIP (exactly the checked folder) + SHA-256
        shell: pwsh
        run: |
          $version = (Select-String -Path CMakeLists.txt -Pattern 'project\(FurnitureOS VERSION ([0-9.]+)').Matches[0].Groups[1].Value
          $name = "FurnitureOS-$version-windows-x64-portable"
          New-Item -ItemType Directory -Force packages | Out-Null
          Compress-Archive -Path dist/FurnitureOS -DestinationPath "packages/$name.zip"
          $hash = (Get-FileHash "packages/$name.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name.zip" | Set-Content -NoNewline "packages/$name.zip.sha256"
          Get-Content "packages/$name.zip.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: FurnitureOS-windows-x64-portable
          path: packages/
          if-no-files-found: error

  # macOS is intentionally absent until that build has been brought up; see PROJECT_STATUS.md.
